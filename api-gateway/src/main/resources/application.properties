spring.application.name=api-gateway
server.port=8080

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Configuration
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes Configuration
spring.cloud.gateway.routes[0].id=base-service
spring.cloud.gateway.routes[0].uri=lb://base-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/users/(?<segment>.*), /api/users/$\{segment}

spring.cloud.gateway.routes[1].id=base-service-dicts
spring.cloud.gateway.routes[1].uri=lb://base-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/dicts/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/dicts/(?<segment>.*), /api/dicts/$\{segment}

spring.cloud.gateway.routes[2].id=base-service-dict-items
spring.cloud.gateway.routes[2].uri=lb://base-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/dict-items/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/dict-items/(?<segment>.*), /api/dict-items/$\{segment}

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedOrigins=http://localhost:3000,http://localhost:8080
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations[/**].allowCredentials=true
